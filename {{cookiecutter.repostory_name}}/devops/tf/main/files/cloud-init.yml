      rm -rf ./aws ./awscliv2.zip ./awscliv2.sig

      # https://docs.docker.com/engine/install/ubuntu/
      DOCKER_APT_KEY_FINGERPRINT="9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o docker.asc
      DOCKER_KEY_FINGERPRINTS="$(gpg --show-keys --with-colons docker.asc | awk -F: '$1 == "pub" { getline; print $10 }')"
      if [ "$DOCKER_KEY_FINGERPRINTS" != "$DOCKER_APT_KEY_FINGERPRINT" ]; then
        echo "Unexpected Docker apt signing key: $DOCKER_KEY_FINGERPRINTS"
        exit 1
      fi
      sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg docker.asc
      rm -f docker.asc
      echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
      gpasswd -a ubuntu docker
      mkdir -p /etc/docker/

      if [ ! -f /etc/docker/daemon.json ]; then
        echo '{ "registry-mirrors": ["https://mirror.gcr.io"] }' > /etc/docker/daemon.json
      else
        jq '.["registry-mirrors"] += ["https://mirror.gcr.io"]' /etc/docker/daemon.json > /etc/docker/daemon.tmp && mv /etc/docker/daemon.tmp /etc/docker/daemon.json
      fi

      service docker restart

  - path: /home/ubuntu/cloud-init.sh
    permissions: '0755'
    content: |
      #!/bin/bash

      export APP_NAME=${name}
      export APP_ENV=${env}

      aws ssm describe-parameters | jq -r '.Parameters[].Name' | grep "\/application\/$APP_NAME\/$APP_ENV" | sed "s/\/application.*$APP_ENV\///" | while read -r FILE; do
          mkdir -p $(dirname "$FILE");
          aws ssm get-parameter --name "/application/$APP_NAME/$APP_ENV/$FILE" --output text --with-decrypt --query 'Parameter.Value' | sed "s/###//g" > "$FILE";
      done

      source .envrc

      export INSTANCE_ID_SUBST=`wget http://169.254.169.254/latest/meta-data/instance-id -O- --timeout=5 --tries=1`
      [ -z "$INSTANCE_ID_SUBST" ] && export INSTANCE_ID_SUBST='{% raw %}{{.FullID}}{% endraw %}'
      echo "INSTANCE_ID_SUBST=$INSTANCE_ID_SUBST" >> .env

      [ -f secret.env ] && cat secret.env >> .env


      aws ecr get-login-password --region ${region} | docker login --username AWS --password-stdin "$AWS_ECR_BASE_URL"
      docker pull "$AWS_ECR_BASE_URL/$AWS_ECR_TAG"
      export GIT_SHA=$(docker image inspect "$AWS_ECR_BASE_URL/$AWS_ECR_TAG" | jq -r '.[0].Config.Labels.git_commit_hash // empty')
      if [ -n "$GIT_SHA" ]; then
          sed -i '/^GIT_SHA=/d' .env
          echo "GIT_SHA=$GIT_SHA" >> .env
      fi
      docker compose up -d

runcmd:
  - chown -R ubuntu:ubuntu /home/ubuntu
  - cd /home/ubuntu/
  - "[ -f ./installer.sh ] && ./installer.sh"
  - sudo -u ubuntu ./cloud-init.sh
