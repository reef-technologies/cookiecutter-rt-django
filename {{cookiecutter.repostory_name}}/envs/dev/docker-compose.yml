version: '3.7'

services:
  redis:
    {% if cookiecutter.use_valkey %}
    image: mirror.gcr.io/valkey/valkey:8.1-alpine
    command: valkey-server --appendonly yes
    healthcheck:
      test: valkey-cli ping
    {% else %}
    image: mirror.gcr.io/redis:6-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: redis-cli ping
    {% endif %}
    volumes:
      - ./redis/data:/data
    ports:
      - ${REDIS_PORT}:6379

  db:
    image: mirror.gcr.io/postgres:14.0-alpine
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} || exit 1
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      {% if cookiecutter.monitoring %}
      - POSTGRES_EXPORTER_PASSWORD=${POSTGRES_EXPORTER_PASSWORD}
      {% endif %}
    volumes:
      - ./db/data:/var/lib/postgresql/data
      # first-boot SQL, run only when the data directory is initialised; see db/init/README.md
      - ./db/init:/docker-entrypoint-initdb.d:ro
    {% if cookiecutter.monitoring %}
    command:
      - postgres
      # pg_stat_statements must be preloaded to record per-query timings; postgres-exporter reads it
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
    {% endif %}
    ports:
      - ${POSTGRES_PORT}:5432

  {% if cookiecutter.monitoring %}
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      - DATA_SOURCE_URI=db:5432/${POSTGRES_DB}?sslmode=disable
      - DATA_SOURCE_USER=postgres_exporter
      - DATA_SOURCE_PASS=${POSTGRES_EXPORTER_PASSWORD}
    command:
      - '--collector.stat_statements'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187
  {% endif %}

  backups:
    build:
      context: backups/
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BACKUP_LOCAL_DIR=/var/backups
      - BACKUP_LOCAL_ROTATE_KEEP_LAST=${BACKUP_LOCAL_ROTATE_KEEP_LAST}
      - B2_BUCKET=${BACKUP_B2_BUCKET}
      - B2_FOLDER=${BACKUP_B2_FOLDER}
      - B2_APPLICATION_KEY_ID=${BACKUP_B2_APPLICATION_KEY_ID}
      - B2_APPLICATION_KEY=${BACKUP_B2_APPLICATION_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_TARGET=${EMAIL_TARGET}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - backups:/var/backups
    depends_on:
      - db
    profiles:
      - backups

volumes:
  backups:
