version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
      exclude:
        - "django"
        - "cryptography"
        - "certifi"  # carries a CA bundle
    # security updates only; they are not subject to this limit
    open-pull-requests-limit: 0
