version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
      exclude:
        - "gitpython"
        - "certifi"  # carries a CA bundle
        - "virtualenv"  # embeds pip, which vendors certifi's CA bundle
    # security updates only; they are not subject to this limit
    open-pull-requests-limit: 0
