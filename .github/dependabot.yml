version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
      exclude:
        - "gitpython"
        - "certifi"
  - package-ecosystem: "docker"
    directory: "/{{cookiecutter.repostory_name}}/app/envs/prod"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
